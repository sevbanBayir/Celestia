---
format_version: '13'
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git
project_type: android
workflows:
  build_apk:
    summary: Run your Android unit tests and create an APK file to install your app
      on a device or share it with your team.
    description: The workflow will first clone your Git repository, install Android
      tools, set the project's version code based on the build number, run Android
      lint and unit tests, build the project's APK file and save it.
    steps:
    - activate-ssh-key@4: {}
    - git-clone@8: {}
    - script@1:
        inputs:
        - content: |-
            echo 'Generating local.properties ...'

            cat > "./local.defaults.properties" <<- FILE_CONTENT
            MAPS_API_KEY=$MAPS_API_KEY
            FILE_CONTENT

            cat > "./local.properties" <<- FILE_CONTENT
            API_KEY=$OPENWEATHER_API_KEY
            FILE_CONTENT
    - install-missing-android-tools@3:
        inputs:
        - gradlew_path: "$PROJECT_LOCATION/gradlew"
    - script@1:
        inputs:
        - content: "VERSION_NAME=$(echo \"$BITRISE_GIT_BRANCH\" | sed 's/[^0-9.]*\\([0-9.]*\\).*/\\1/')\n
            echo \"Extracted version name $VERSION_NAME\" \n envman add --key ANDROID_VERSION_NAME
            --value \"$VERSION_NAME\""
    - change-android-versioncode-and-versionname@1:
        inputs:
        - build_gradle_path: "$PROJECT_LOCATION/$MODULE/build.gradle.kts"
        - new_version_name: "$ANDROID_VERSION_NAME"
    - android-build@1:
        inputs:
        - project_location: "$PROJECT_LOCATION"
        - module: "$MODULE"
        - cache_level: none
        - variant: release
        - build_type: aab
    - sign-apk@1:
        run_if: '{{getenv "BITRISEIO_ANDROID_KEYSTORE_URL" | ne ""}}'
    - google-play-deploy@3:
        inputs:
        - package_name: com.sevban.weatherapp
        - track: internal
        - service_account_json_key_path: "$SERVICE_ACCOUNT_PATH"
        - app_path: "$BITRISE_AAB_PATH"
    - deploy-to-bitrise-io@2: {}
    triggers:
      push:
      - branch: "*.*.*/staging"
  run_test:
    summary: Run your Android unit tests and get the test report.
    description: The workflow will first clone your Git repository, cache your Gradle
      dependencies, install Android tools, run your Android unit tests and save the
      test report.
    steps:
    - activate-ssh-key@4: {}
    - git-clone@8: {}
    - script@1:
        inputs:
        - content: |-
            echo 'Generating local.defaults.properties ...'

            cat > "./local.defaults.properties" <<- FILE_CONTENT
            MAPS_API_KEY=$MAPS_API_KEY
            FILE_CONTENT
    - script@1:
        inputs:
        - content: |-
            echo 'Generating local.properties ...'

            cat > "./local.properties" <<- FILE_CONTENT
            API_KEY=$OPENWEATHER_API_KEY
            FILE_CONTENT
    - restore-gradle-cache@2: {}
    - install-missing-android-tools@3:
        inputs:
        - gradlew_path: "$PROJECT_LOCATION/gradlew"
    - android-unit-test@1:
        inputs:
        - project_location: "$PROJECT_LOCATION"
        - variant: "$VARIANT"
        - cache_level: none
    - save-gradle-cache@1: {}
    - deploy-to-bitrise-io@2: {}
    triggers:
      push: []
      pull_request:
      - target_branch: development
        draft_enabled: false
    meta:
      bitrise.io:
        stack: linux-docker-android-22.04
        machine_type_id: standard
  run_ui_tests:
    summary: Run your Android UI tests and get the test report.
    description: The workflow will first clone your Git repository, cache your Gradle
      dependencies, install Android tools, run your Android unit tests and save the
      test report.
    steps:
    - activate-ssh-key@4: {}
    - git-clone@8: {}
    - script@1:
        inputs:
        - content: |-
            echo 'Generating local.defaults.properties ...'

            cat > "./local.defaults.properties" <<- FILE_CONTENT
            MAPS_API_KEY=$MAPS_API_KEY
            FILE_CONTENT
    - script@1:
        inputs:
        - content: |-
            echo 'Generating local.properties ...'

            cat > "./local.properties" <<- FILE_CONTENT
            API_KEY=$OPENWEATHER_API_KEY
            FILE_CONTENT
    - restore-gradle-cache@2: {}
    - install-missing-android-tools@3:
        inputs:
        - gradlew_path: "$PROJECT_LOCATION/gradlew"
    - android-unit-test@1:
        inputs:
        - project_location: "$PROJECT_LOCATION"
        - variant: "$VARIANT"
        - cache_level: none
    - android-build-for-ui-testing@0:
        inputs:
        - variant: debug
        - module: app,feature:detail
    - avd-manager@2: {}
    - wait-for-android-emulator@1: {}
    - android-instrumented-test@0: {}
    - save-gradle-cache@1: {}
    - deploy-to-bitrise-io@2: {}
    triggers:
      push: []
      pull_request:
      - target_branch:
          regex: staging
        draft_enabled: false
    meta:
      bitrise.io:
        stack: linux-docker-android-22.04
        machine_type_id: standard
  deploy_to_prod:
    summary: Run your Android unit tests and create an APK file to install your app
      on a device or share it with your team.
    description: The workflow will first clone your Git repository, install Android
      tools, set the project's version code based on the build number, run Android
      lint and unit tests, build the project's APK file and save it.
    steps:
    - activate-ssh-key@4: {}
    - git-clone@8: {}
    - script@1:
        inputs:
        - content: |-
            echo 'Generating local.properties ...'

            cat > "./local.defaults.properties" <<- FILE_CONTENT
            MAPS_API_KEY=$MAPS_API_KEY
            FILE_CONTENT

            cat > "./local.properties" <<- FILE_CONTENT
            API_KEY=$OPENWEATHER_API_KEY
            FILE_CONTENT
    - install-missing-android-tools@3:
        inputs:
        - gradlew_path: "$PROJECT_LOCATION/gradlew"
    - script@1:
        inputs:
        - content: "VERSION_NAME=$(echo \"$BITRISE_GIT_BRANCH\" | sed 's/[^0-9.]*\\([0-9.]*\\).*/\\1/')\n
            echo \"Extracted version name $VERSION_NAME\" \n envman add --key ANDROID_VERSION_NAME
            --value \"$VERSION_NAME\""
    - change-android-versioncode-and-versionname@1:
        inputs:
        - build_gradle_path: "$PROJECT_LOCATION/$MODULE/build.gradle.kts"
        - new_version_name: "$ANDROID_VERSION_NAME"
    - android-build@1:
        inputs:
        - project_location: "$PROJECT_LOCATION"
        - module: "$MODULE"
        - cache_level: none
        - variant: release
        - build_type: aab
    - sign-apk@1:
        run_if: '{{getenv "BITRISEIO_ANDROID_KEYSTORE_URL" | ne ""}}'
    - google-play-deploy@3:
        inputs:
        - package_name: com.sevban.weatherapp
        - track: production
        - service_account_json_key_path: "$SERVICE_ACCOUNT_PATH"
        - app_path: "$BITRISE_AAB_PATH"
    - deploy-to-bitrise-io@2: {}
    triggers:
      push:
      - branch: "*.*.*/release"
  deploy_to_internal_test_track:
    summary: Run your Android unit tests and create an APK file to install your app
      on a device or share it with your team.
    description: The workflow will first clone your Git repository, install Android
      tools, set the project's version code based on the build number, run Android
      lint and unit tests, build the project's APK file and save it.
    steps:
    - activate-ssh-key@4: {}
    - git-clone@8: {}
    - script@1:
        inputs:
        - content: |-
            echo 'Generating local.properties ...'

            cat > "./local.defaults.properties" <<- FILE_CONTENT
            MAPS_API_KEY=$MAPS_API_KEY
            FILE_CONTENT

            cat > "./local.properties" <<- FILE_CONTENT
            API_KEY=$OPENWEATHER_API_KEY
            FILE_CONTENT
    - install-missing-android-tools@3:
        inputs:
        - gradlew_path: "$PROJECT_LOCATION/gradlew"
    - script@1:
        inputs:
        - content: "VERSION_NAME=$(echo \"$BITRISE_GIT_BRANCH\" | sed 's/[^0-9.]*\\([0-9.]*\\).*/\\1/')\n
            echo \"Extracted version name $VERSION_NAME\" \n envman add --key ANDROID_VERSION_NAME
            --value \"$VERSION_NAME\""
    - change-android-versioncode-and-versionname@1:
        inputs:
        - build_gradle_path: "$PROJECT_LOCATION/$MODULE/build.gradle.kts"
        - new_version_name: "$ANDROID_VERSION_NAME"
    - android-build@1:
        inputs:
        - project_location: "$PROJECT_LOCATION"
        - module: "$MODULE"
        - cache_level: none
        - variant: release
        - build_type: aab
    - sign-apk@1:
        run_if: '{{getenv "BITRISEIO_ANDROID_KEYSTORE_URL" | ne ""}}'
    - google-play-deploy@3:
        inputs:
        - package_name: com.sevban.weatherapp
        - track: internal
        - service_account_json_key_path: "$SERVICE_ACCOUNT_PATH"
        - app_path: "$BITRISE_AAB_PATH"
    - deploy-to-bitrise-io@2: {}
    triggers:
      push:
      - branch: "*.*.*/staging"
meta:
  bitrise.io:
    stack: linux-docker-android-22.04
    machine_type_id: standard
app:
  envs:
  - PROJECT_LOCATION: "."
    opts:
      is_expand: false
  - MODULE: app
    opts:
      is_expand: false
  - VARIANT: debug
    opts:
      is_expand: false
